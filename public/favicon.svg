<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-opacity="0.35"/>
    </filter>
    
    <!-- Cover Gradient (Premium Charcoal) -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3139"/>
      <stop offset="50%" stop-color="#1b1c20"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>

    <!-- Gold Gradient (Metallic Gold) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Ribbon Gradient (Royal Red) -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Ribbon hanging at the bottom -->
  <path d="M20,38 V45 L21.5,43.5 L23,45 V38 Z" fill="url(#ribbonGrad)" filter="url(#shadow)" />

  <!-- Gold Page Edges -->
  <rect x="33" y="6" width="3" height="31" rx="1.5" fill="url(#goldGrad)" />
  <rect x="11" y="38" width="23" height="3" rx="1" fill="url(#goldGrad)" />

  <!-- Book Spine Backing (adds depth) -->
  <rect x="6" y="4" width="4" height="38" rx="2" fill="#111215" />

  <!-- Main Book Cover -->
  <rect x="8" y="4" width="26" height="35" rx="3" fill="url(#coverGrad)" filter="url(#shadow)" />

  <!-- Left Spine Highlight -->
  <rect x="10" y="4" width="1.5" height="35" fill="#ffffff" fill-opacity="0.12" />
  <rect x="8.5" y="4" width="1" height="35" fill="#000000" fill-opacity="0.4" />

  <!-- Spine Gold Corner Fillets or Accents -->
  <path d="M 12 4 L 32 4" stroke="url(#goldGrad)" stroke-width="0.5" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 12 39 L 32 39" stroke="url(#goldGrad)" stroke-width="0.5" fill="none" opacity="0.6" stroke-linecap="round" />

  <!-- Golden Star of David (Magen David) on Cover -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- Triangle 1 (Pointing Up) -->
    <polygon points="21,11 15.5,20.5 26.5,20.5" />
    <!-- Triangle 2 (Pointing Down) -->
    <polygon points="21,23.5 15.5,14 26.5,14" />
  </g>
</svg>